[project]
name = "eamcp"
version = "1.0.0"
description = "Enterprise AI + MCP + Multi-Agent Platform — Python SDK (Phase 5 / v1.0)"
authors = [{ name = "EAMCP Platform Team", email = "platform@example.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0", "pydantic>=2.7"]

[project.urls]
Documentation = "https://example.com/docs/sdk/python"
Source        = "https://github.com/example/eamcp-platform"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eamcp"]
