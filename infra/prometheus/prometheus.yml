global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'eamcp-backend'
    metrics_path: /api/observability/metrics
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
