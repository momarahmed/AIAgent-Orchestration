apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eamcp.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "eamcp.name" . }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: eamcp-backend
  template:
    metadata:
      labels:
        app: eamcp-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.global.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
          {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
