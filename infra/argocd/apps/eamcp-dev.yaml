apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eamcp-dev
  namespace: argocd
spec:
  project: eamcp
  source:
    repoURL: https://github.com/example/eamcp-platform.git
    targetRevision: main
    path: infra/helm/eamcp
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eamcp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
