apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eamcp-staging
  namespace: argocd
spec:
  project: eamcp
  source:
    repoURL: https://github.com/example/eamcp-platform.git
    targetRevision: main
    path: infra/helm/eamcp
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eamcp-stg
  syncPolicy:
    # No auto-sync to staging — requires manual approval per Phase 5 PRD.
    syncOptions:
      - CreateNamespace=true
