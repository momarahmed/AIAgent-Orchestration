apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eamcp-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eamcp
spec:
  project: eamcp
  source:
    repoURL: https://github.com/example/eamcp-platform.git
    targetRevision: main
    path: infra/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
